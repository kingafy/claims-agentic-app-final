apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-agentic-app
  namespace: claims-app
  labels:
    app: claims-agentic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-agentic-app
  template:
    metadata:
      labels:
        app: claims-agentic-app
    spec:
      containers:
        - name: claims-agentic-app
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/<REPO_NAME>:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: APP_NAME
              value: "claims_adk_app"
            - name: ADK_MODEL_NAME
              value: "gemini-2.0-flash"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claims-secrets
                  key: google_api_key
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: claims-secrets
                  key: langfuse_public_key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: claims-secrets
                  key: langfuse_secret_key
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: claims-secrets
                  key: langfuse_base_url
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
